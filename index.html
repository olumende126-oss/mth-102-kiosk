<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTH 102 Practice Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#17231c;font-family:Arial,sans-serif}
header{background:#126b43;color:white;padding:18px 16px;text-align:center}
main{max-width:760px;margin:18px auto;padding:0 12px}
.card{background:white;border-radius:12px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #00000012}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:bold}
#timer{color:#126b43;font-size:1.2rem}
.question{font-weight:700;margin:0 0 12px;line-height:1.45}
label.option{display:block;border:1px solid #d7e0da;border-radius:9px;padding:12px;margin:8px 0;cursor:pointer}
label.option:has(input:checked){border-color:#126b43;background:#edf8f1}
input{margin-right:8px}
button{border:0;border-radius:9px;padding:12px 18px;font-weight:bold;cursor:pointer}
.primary{background:#126b43;color:white}.secondary{background:#e5eee8;color:#17231c}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
#result{display:none}.small{color:#5d6b62;font-size:.92rem;line-height:1.5}
</style>
</head>
<body>
<header><h1>MTH 102 Practice Quiz</h1><div>Calculus • Multiple choice</div></header>
<main>
<section class="card">
<div class="meta"><span id="progress">10 questions</span><span id="timer">07:00</span></div>
<p class="small">Choose one answer for each question. Your score will appear after you submit. This practice quiz runs locally in your browser.</p>
</section>
<form id="quiz"></form>
<div class="actions"><button class="primary" type="button" id="submit">Submit quiz</button><button class="secondary" type="button" id="reset">Restart</button></div>
<section class="card" id="result" aria-live="polite"></section>
</main>
<script>
const questions=[
{q:"Differentiate f(x) = x³ − 4x² + 2x − 7.",a:["3x² − 8x + 2","3x² − 4x + 2","x² − 8x + 2","3x² − 8x − 7"],c:0,e:"Apply the power rule to each term; the derivative of a constant is zero."},
{q:"Evaluate lim (x² − 9)/(x − 3) as x approaches 3.",a:["0","3","6","Does not exist"],c:2,e:"Factor x² − 9 as (x − 3)(x + 3), then evaluate the simplified expression at x = 3."},
{q:"Find ∫ 6x² dx.",a:["2x³ + C","18x + C","6x³ + C","3x² + C"],c:0,e:"Increase the power by one and divide the coefficient by the new power."},
{q:"If y = sin x, what is dy/dx?",a:["−sin x","cos x","−cos x","tan x"],c:1,e:"Use the standard derivative rule for sine."},
{q:"Differentiate y = (2x + 1)⁵.",a:["5(2x + 1)⁴","10(2x + 1)⁴","(2x + 1)⁴","10(2x + 1)⁵"],c:1,e:"Use the chain rule: differentiate the outer power and multiply by the derivative of the inner expression."},
{q:"Evaluate ∫₀² x dx.",a:["1","2","3","4"],c:1,e:"An antiderivative is x²/2. Evaluate it at the upper and lower limits and subtract."},
{q:"What is the derivative of ln x for x > 0?",a:["x","1/x","ln x / x","eˣ"],c:1,e:"Recall the standard derivative of the natural logarithm."},
{q:"Find the slope of the curve y = x² + 3x at x = 2.",a:["5","7","4","11"],c:1,e:"Differentiate first to obtain the slope function, then substitute x = 2."},
{q:"Which rule is used to differentiate a product of two functions?",a:["Chain rule","Quotient rule","Product rule","Power rule"],c:2,e:"The rule's name describes differentiating two factors multiplied together."},
{q:"Evaluate lim (sin x)/x as x approaches 0, with x in radians.",a:["0","1","−1","Does not exist"],c:1,e:"This is a standard trigonometric limit when the angle is measured in radians."}
];
const form=document.getElementById("quiz");
questions.forEach((item,i)=>{
 const card=document.createElement("section");card.className="card";
 const q=document.createElement("p");q.className="question";q.textContent=`${i+1}. ${item.q}`;card.appendChild(q);
 item.a.forEach((ans,j)=>{
  const label=document.createElement("label");label.className="option";
  const input=document.createElement("input");input.type="radio";input.name=`q${i}`;input.value=j;
  label.append(input,document.createTextNode(ans));card.appendChild(label);
 });
 form.appendChild(card);
});
let remaining=7*60, finished=false;
const timer=document.getElementById("timer");
function tick(){if(finished)return;const m=Math.floor(remaining/60),s=remaining%60;timer.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;if(remaining<=0){submitQuiz();return}remaining--;}
tick();const interval=setInterval(tick,1000);
function submitQuiz(){
 if(finished)return;finished=true;clearInterval(interval);
 let score=0, review="";
 questions.forEach((item,i)=>{
  const selected=form.querySelector(`input[name="q${i}"]:checked`);
  const correct=selected&&Number(selected.value)===item.c;if(correct)score++;
  review+=`<div class="card"><strong>${i+1}. ${correct?"Correct":"Not answered or incorrect"}</strong><p>${item.q}</p><p>Answer: ${item.a[item.c]}</p><p class="small">${item.e}</p></div>`;
 });
 const result=document.getElementById("result");result.style.display="block";
 result.innerHTML=`<h2>Your result: ${score} / ${questions.length}</h2><p>${Math.round(score/questions.length*100)}%</p><h3>Review</h3>${review}`;
 document.getElementById("submit").disabled=true;
 result.scrollIntoView({behavior:"smooth"});
}
document.getElementById("submit").addEventListener("click",submitQuiz);
document.getElementById("reset").addEventListener("click",()=>location.reload());
</script>
</body>
</html>
